name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! npx wrangler pages project list --json | jq '.[] | select(.["Project Name"] | test("^${{ vars.PROJECT_NAME }}$"))' | jq -e '.["Project Name"]' >/dev/null 2>&1 ; then
            npx wrangler pages project create ${{ vars.PROJECT_NAME }} --production-branch main
            echo "Project doesn't exist, so created it!"
          fi || echo "Project already exist!"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy . --project-name=${{ vars.PROJECT_NAME }}
