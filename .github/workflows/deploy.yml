name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Ensure Pages project exists
        run: |
          if ! npx wrangler pages project list --json | jq -e '.[] | select(.name=="simple-page")' >/dev/null; then
            npx wrangler pages project create simple-page --production-branch main
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          #accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=simple-page
          #gitHubToken: ${{ secrets.GITHUB_TOKEN }}
